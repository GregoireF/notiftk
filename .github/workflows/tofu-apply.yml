name: tofu · apply

on:
  push:
    branches: [main]
    paths:
      - "infra/flyio/**"
      - ".github/workflows/tofu-*.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tofu-apply-main
  cancel-in-progress: false  # never interrupt an apply in progress

jobs:
  apply:
    name: Apply · infra/flyio
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: opentofu/setup-opentofu@847eaa4afeb791b06daa46e8eafa8b1b68d7cfb4 # v2.0.1
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Init
        run: tofu -chdir=infra/flyio init

      - name: Apply
        run: tofu -chdir=infra/flyio apply -auto-approve -no-color
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
