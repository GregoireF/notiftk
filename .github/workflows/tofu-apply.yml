name: tofu · apply

on:
  push:
    branches: [main]
    paths:
      - "infra/flyio/**"
      - ".github/workflows/tofu-*.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tofu-apply-main
  cancel-in-progress: false  # never interrupt an apply in progress

jobs:
  apply:
    name: Apply · infra/flyio
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Init
        run: tofu -chdir=infra/flyio init

      - name: Apply
        run: tofu -chdir=infra/flyio apply -auto-approve -no-color
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
