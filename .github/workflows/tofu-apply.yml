name: tofu · apply

on:
  push:
    branches: [main]
    paths:
      - "infra/flyio/**"
      - ".github/workflows/tofu-*.yml"

permissions:
  contents: read

concurrency:
  group: tofu-apply-main
  cancel-in-progress: false  # never interrupt an apply in progress

jobs:
  apply:
    name: Apply · infra/flyio
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: opentofu/setup-opentofu@fc711fa910b93cba0f3fbecaafc9f42fd0c411cb # v2.0.0
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Init
        run: tofu -chdir=infra/flyio init

      - name: Apply
        run: tofu -chdir=infra/flyio apply -auto-approve -no-color
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
